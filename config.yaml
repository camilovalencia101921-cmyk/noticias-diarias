# =====================================================================
#  NOTICIAS DIARIAS - archivo de configuración
#  ATENCIÓN: el repositorio es PÚBLICO. Todo lo que escribas aquí
#  lo puede ver cualquier persona. No pongas datos personales ni claves.
#  Para apagar algo cambia "activo: true" por "activo: false".
# =====================================================================

pagina:
  titulo: "Noticias diarias"
  zona_horaria: "America/Bogota"
  dias_archivo: 7            # páginas anteriores que se conservan en /archivo
  # Dirección pública de la página (se usa en Telegram y correo). Ej:
  # https://TU-USUARIO.github.io/noticias-diarias/
  url_publica: ""

portada_imagen:
  activo: true               # usa assets/portada.jpg si existe
  archivo: "assets/portada.jpg"
  color_respaldo: "#17203A"

# ---------------------------------------------------------------------
#  MODELO DE IA GRATUITO (Gemini, Google AI Studio)
#  La clave va como secreto GEMINI_API_KEY en GitHub, NUNCA aquí.
# ---------------------------------------------------------------------
gemini:
  activo: true
  modelo: "gemini-3.5-flash"   # si falla o está saturado, se prueban otros Flash disponibles
  max_candidatos: 160          # titulares enviados en el lote 1
  reintentos: 3
  pausa_segundos: 30           # espera ante límite de cuota

# ---------------------------------------------------------------------
#  SELECCIÓN: solo lo importante (puntaje de 1 a 10)
#  Los máximos NO son metas: si pocas noticias superan el mínimo,
#  la página trae menos.
# ---------------------------------------------------------------------
seleccion:
  minimo_serias: 6
  minimo_ocio: 5
  minimo_local: 5
  max_serias: 14
  max_ocio: 10
  max_local: 8               # lo local tiene su propio tope, aparte de serias y ocio
  ver_mas_por_seccion: 6     # bloque plegable "Ver más" en cada sección (0 = sin bloque); no cuenta para los topes
  cupo_por_tema: 3           # máximo de noticias de un mismo tema
  horas_maximas: 36          # ignora noticias más viejas que esto
  similitud_duplicados: 0.55 # 0 a 1; más alto = solo elimina títulos casi idénticos
  # Palabras de impacto (suben "consecuencias" en el modo de respaldo)
  palabras_impacto: [ley, decreto, decisión, sentencia, fallo, tutela, reforma, sismo, terremoto, huracán, tsunami, erupción, inundación, emergencia, ataque, guerra, bombardeo, cese al fuego, elecciones, renuncia, captura, condena, imputación, masacre, tasa de interés, inflación, desempleo, aranceles, sanciones, acuerdo, crisis, apagón, racionamiento, alerta roja, vulnerabilidad, hackeo, filtración de datos, epidemia, brote, vacuna]
  # Titulares con estas palabras nunca entran (loterías, horóscopos, etc.)
  palabras_descartar: [lotería, resultados del chance, horóscopo, horoscopo, "signo zodiacal", "receta de", "cómo ver en vivo", "dónde ver", "en vivo y en directo", "minuto a minuto", "a qué hora juega", "pronóstico de apuestas", "cuotas de apuestas", "ofertas del día"]

# ---------------------------------------------------------------------
#  FILTRO ANTI-SENSACIONALISMO (solo mira el titular, sin IA)
#  Cada señal resta puntos; si la suma llega al límite, no entra.
#  Fuentes con "filtro: flexible" solo descartan los ganchos claros.
# ---------------------------------------------------------------------
filtro_sensacionalismo:
  activo: true
  limite: 3
  frases_gancho: ["no vas a creer", "no creerás", "lo que nadie te cuenta", "esto es lo que debes saber", "se filtró", "te sorprenderá", "no lo vas a creer", "quedó en shock", "dejó a todos", "nadie esperaba", "lo que pasó después", "así reaccionó", "explota en redes", "se volvió viral", "video viral", "la razón te sorprenderá", "mira lo que", "atención:", "urgente:", "última hora:"]
  superlativos: [histórico, histórica, brutal, escandaloso, escandalosa, impactante, increíble, insólito, insólita, épico, épica, demoledor, demoledora, aterrador, aterradora, bochornoso, polémico]
  inicios_sin_sujeto: ["así fue", "así es", "así quedó", "esto es", "este es", "esta es", "estos son", "lo que", "mira ", "conoce ", "descubre ", "entérate", "ojo con"]
  siglas_permitidas: [NBA, WNBA, FMS, ONU, OTAN, EE.UU., EEUU, UE, FMI, DIAN, ELN, JEP, CNE, IA, AI, USGS, IDEAM, UNGRD, TRM, PIB, IPC, EPM, ESPN, FIFA, UEFA, CIA, FBI, OMS, OPS, OPEP, SGC, BCE, FED]
  penalizaciones:
    frase_gancho: 3
    pregunta_retorica: 2
    mayusculas_sostenidas: 2
    exceso_exclamaciones: 2
    superlativo: 1
    sin_sujeto: 2

# ---------------------------------------------------------------------
#  FILTRO ANTI-PUBLICIDAD (siempre estricto, va antes de clasificar)
#  Se revisa en título, etiquetas y dirección (URL).
# ---------------------------------------------------------------------
filtro_publicidad:
  activo: true
  frases: ["contenido patrocinado", "publirreportaje", "publicidad", "brand content", "sponsored", "advertorial", "con el apoyo de", "alianza comercial", "contenido-patrocinado", "brand-content", "patrocinado", "contenido de marca", "especial comercial"]
  # Si aparece alguna de estas, la noticia entra con la etiqueta "Posible patrocinio"
  frases_duda: ["en alianza con", "presentado por", "de la mano de", "promoción", "descuento", "cupón", "black friday", "compra ya", "oferta especial", "lanzamiento de la marca"]

