# ---------------------------------------------------------------------
#  NOTICIAS LOCALES
#  modo: "ciudad" | "zonas" | "personalizado"
#  Los datos de los tres modos se guardan a la vez; solo se usa el elegido.
# ---------------------------------------------------------------------
local:
  activo: true
  modo: "zonas"
  # --- modo "ciudad" ---
  ciudad:
    nombre: "Montería"          # EJEMPLO: reemplázalo por tu ciudad
    departamento: "Córdoba"
    busqueda_departamento: "Córdoba Colombia"
  # --- modo "zonas" (en orden de prioridad) ---
  zonas:
    - nombre: "Córdoba"          # EJEMPLO: reemplázalo por tu zona
      lugares: ["Montería", "Lorica"]
      busqueda_departamento: "Córdoba Colombia"
    - nombre: "Medellín"         # EJEMPLO: reemplázalo por tu zona
      lugares: ["Medellín"]
      busqueda_departamento: "Antioquia"
  # --- modo "personalizado" ---
  personalizado:
    palabras_clave: ["Montería", "Lorica", "Alcaldía de Montería", "Gobernación de Córdoba", "Sinú"]   # EJEMPLO
    feeds: []                  # ej: - {nombre: "Mi medio", url: "https://..."}
  # Fuentes locales (se usan en todos los modos). Todas con filtro flexible.
  fuentes:
    - {nombre: "El Meridiano Córdoba", url: "https://elmeridiano.co/cordoba/sitemap-news.xml", tipo: sitemap, alcance: local, filtro: flexible, activo: true, excluir_rutas: ["/opinion/"]}
    - {nombre: "El Meridiano Sucre", url: "https://elmeridiano.co/sucre/sitemap-news.xml", tipo: sitemap, alcance: local, filtro: flexible, activo: true, excluir_rutas: ["/opinion/"]}
    - {nombre: "El Meridiano (Google News)", url: "https://news.google.com/rss/search?q=site:elmeridiano.co+when:2d&hl=es-419&gl=CO&ceid=CO:es-419", alcance: local, filtro: flexible, activo: false}
    - {nombre: "El Meridiano (YouTube)", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC8H6nfVV_plO1xuR6xLpyOw", alcance: local, filtro: flexible, activo: true}
    - {nombre: "Q'hubo Medellín", url: "https://qhubomedellin.com/sitemapforgoogle.xml", tipo: sitemap, alcance: local, filtro: flexible, activo: true}
    - {nombre: "La Razón (Córdoba)", url: "https://larazon.co/feed/", alcance: local, filtro: flexible, activo: true}
    - {nombre: "El Colombiano Medellín", url: "https://www.elcolombiano.com/rss/medellin.xml", alcance: local, filtro: flexible, activo: true}
    - {nombre: "El Colombiano Antioquia", url: "https://www.elcolombiano.com/rss/antioquia.xml", alcance: local, filtro: flexible, activo: true}
    - {nombre: "Minuto30", url: "https://www.minuto30.com/feed/", alcance: local, filtro: flexible, activo: true}
  buscar_en_google_news: true  # busca también noticias de los lugares de la zona/ciudad
  # Categorías del bloque Local
  categorias:
    seguridad:
      nombre: "Seguridad"
      color: "#C62828"
      peso: 1.2
      palabras: [homicidio, asesinado, asesinato, sicario, sicarios, robo, hurto, capturado, capturados, policía, extorsión, balacera, ataque, muerto, muertos, cadáver, cuerpo, crimen, riña, herido, heridos, judicial, fiscalía, cárcel, condenado, secuestro, desaparecido, "a bala", disparos, "arma blanca", violencia, feminicidio]
    orden_publico:
      nombre: "Orden público"
      color: "#E65100"
      peso: 1.2
      palabras: [marcha, bloqueo, bloqueos, paro, protesta, protestas, disturbios, asonada, manifestación, operativo, "toque de queda", "consejo de seguridad", "ley seca", desalojo, invasión]
    movilidad_servicios:
      nombre: "Movilidad y servicios"
      color: "#1565C0"
      peso: 1.0
      palabras: [tránsito, movilidad, vía, vías, accidente, "pico y placa", trancón, transporte, metro, bus, buses, puente, aeropuerto, agua, acueducto, "corte de agua", energía, "corte de luz", luz, gas, afinia, epm, "servicios públicos", alcantarillado, basuras, aseo, racionamiento, tarifas, vuelo, ruta]
    otros:
      nombre: "Otros"
      color: "#546E7A"
      peso: 1.0
      palabras: []
  # Botones a perfiles de Instagram (el programa NO lee Instagram)
  # Máximo 6 botones. Solo se muestran los que tienen "activo: true" y una URL válida.
  # Estos perfiles NO están verificados (Instagram exige iniciar sesión para revisarlos).
  instagram:
    - {nombre: "El Meridiano", url: "https://www.instagram.com/elmeridiano.co", activo: true}
    - {nombre: "Río Noticias", url: "https://www.instagram.com/rionoticiasco", activo: true}
    - {nombre: "Lo que sale en Lorica", url: "https://www.instagram.com/loquesaenlorica", activo: true}
    - {nombre: "Chica Noticias", url: "", activo: false}     # pendiente de enlace
    - {nombre: "El Propio", url: "", activo: false}          # pendiente de enlace
    - {nombre: "Q'hubo Medellín", url: "", activo: false}    # pendiente de enlace

# ---------------------------------------------------------------------
#  PARA EL ALMA: 3 temas de espiritualidad al día, escritos por Gemini.
#  Si Gemini falla, la sección se omite ese día ("Hoy no disponible").
#  Los temas publicados se guardan en temas-publicados.json (últimos 120)
#  para no repetirlos.
# ---------------------------------------------------------------------
para_el_alma:
  activo: true
  color: "#C98A1B"           # ámbar
  temas_por_dia: 3
  historial_maximo: 120
  # Tradiciones que rotan. "frecuencia": cuántos días de cada 3 aparece (cristianismo casi siempre).
  categorias:
    - {clave: cristianismo, nombre: "Cristianismo y misticismo cristiano", frecuencia: 2}
    - {clave: budismo, nombre: "Budismo", frecuencia: 1}
    - {clave: estoicismo, nombre: "Estoicismo", frecuencia: 1}
    - {clave: sufismo, nombre: "Sufismo", frecuencia: 1}
    - {clave: meditacion, nombre: "Meditación y ciencia", frecuencia: 1}
    - {clave: simbolos, nombre: "Símbolos, rituales y lugares sagrados", frecuencia: 1}

# ---------------------------------------------------------------------
#  CINE: estrenos de películas en Colombia (de la semana y próximos).
#  1) Búsqueda de Google integrada en Gemini (UNA llamada al día), solo con
#     modelos cuyo nivel GRATUITO la incluye (hoy: gemini-2.5-flash y -lite).
#  2) Si no está disponible: datos públicos de la página de Cinemark Colombia.
#  3) Si nada es confiable: "Sin estrenos confirmados hoy". Nunca se inventan.
#  NO actives la facturación de Google Cloud: la búsqueda solo es gratis
#  dentro de su cuota y luego se cobra.
# ---------------------------------------------------------------------
cine:
  activo: true
  color: "#D64550"
  busqueda_gemini: true
  modelos_busqueda_gratuita: ["gemini-2.5-flash", "gemini-2.5-flash-lite"]
  respaldo_cinemark: true
  dias_hacia_adelante: 30    # "próximos" = hasta 30 días desde hoy
  maximo: 12
  excluir_generos: [Musical, Concierto, Música]

